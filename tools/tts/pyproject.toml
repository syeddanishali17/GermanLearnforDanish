[project]
name = "ustad-tts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.4",
  "numpy",
  "soundfile",
  "huggingface_hub",
  "misaki @ git+https://github.com/semidark/misaki.git@6d252a2e02f3b030f22f56686f1a73786c16ffc8",
  "kokoro @ git+https://github.com/semidark/kokoro.git",
  "lameenc>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
